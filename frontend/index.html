<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rent tractors and agricultural machinery near you. Save money, share equipment, and grow more with AgriMachConnect.">
    <title>AgriMachConnect — Smart Farming Starts Here</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="preload" as="image" href="/assets/images/Golden%20Hour%20Tractor%20in%20Farmland.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        .home-page {
            --home-green: #0B3D25;
            --home-green-bright: #159447;
            --home-gold: #FFC857;
            color: #ffffff;
            background: #f7f8f4;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .home-hero {
            position: relative;
            isolation: isolate;
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            overflow: hidden;
            background-color: var(--home-green);
            background-image:
                linear-gradient(105deg, rgba(6, 42, 24, 0.96) 0%, rgba(8, 58, 34, 0.87) 48%, rgba(9, 73, 39, 0.56) 100%),
                url("/assets/images/Golden%20Hour%20Tractor%20in%20Farmland.png");
            background-position: center;
            background-size: cover;
        }

        .home-hero::after {
            position: absolute;
            z-index: -1;
            background: linear-gradient(0deg, rgba(5, 35, 20, 0.35), transparent 34%);
            content: "";
            inset: 0;
            pointer-events: none;
        }

        .home-header {
            position: absolute;
            z-index: 1;
            top: 0;
            left: 0;
            display: flex;
            width: 100%;
            min-height: 96px;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: nowrap;
            padding: 12px clamp(24px, 6vw, 88px);
            border: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
        }

        .home-logo {
            display: inline-flex;
            flex: 0 1 340px;
            flex-direction: column;
            align-items: flex-start;
            text-decoration: none;
        }

        .home-logo img {
            display: block;
            width: min(100%, 340px);
            height: 86px;
            flex: 0 0 auto;
            object-fit: cover;
            object-position: center;
            transition: filter 220ms ease, transform 220ms ease;
        }

        .home-logo:hover img {
            transform: translateY(-1px);
            filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.55)) drop-shadow(0 0 13px rgba(255, 201, 40, 0.38));
        }

        .home-brand-tagline {
            margin-top: -7px;
            color: #ffffff;
            font-size: 0.74rem;
            font-weight: 600;
            letter-spacing: 0.075em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
        }

        .home-nav {
            display: flex;
            width: auto;
            flex: 0 0 auto;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            gap: 11px;
            padding: 0;
        }

        .home-nav a,
        .home-hero a.home-button {
            display: inline-flex;
            min-height: 50px;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 20px;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            background: rgba(8, 45, 27, 0.28);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.16);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
            transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
        }

        .home-nav a:focus-visible,
        .home-hero a.home-button:focus-visible {
            outline: 3px solid var(--home-gold);
            outline-offset: 3px;
        }

        .home-nav .home-nav-icon,
        .home-hero .home-button-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .home-nav .home-nav-icon {
            color: #9be7b4;
        }

        .home-nav a:hover,
        .home-hero a.home-button:hover {
            transform: translateY(-2px) scale(1.02);
            border-color: var(--home-gold);
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            box-shadow: 0 0 16px rgba(21, 148, 71, 0.22), 0 10px 24px rgba(0, 0, 0, 0.2);
        }

        .home-nav a:active,
        .home-hero a.home-button:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 0 16px rgba(52, 211, 153, 0.28);
        }

        .home-nav a.home-register {
            border-color: #FFC928;
            background: #FFC928;
            box-shadow: 0 0 15px rgba(255, 201, 40, 0.3), 0 7px 18px rgba(0, 0, 0, 0.16);
            color: #10452D;
            transition: transform 180ms ease, background-color 180ms ease, border-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
        }

        .home-hero a.home-button.home-register {
            border-color: #FFC928;
            background: #FFC928;
            box-shadow: 0 0 15px rgba(255, 201, 40, 0.3), 0 7px 18px rgba(0, 0, 0, 0.16);
            color: #10452D;
        }

        .home-nav a.home-register:hover {
            transform: translateY(-2px) scale(1.03);
            border-color: #FFDA57;
            background: #FFDA57;
            box-shadow: 0 0 22px rgba(255, 201, 40, 0.48), 0 10px 24px rgba(0, 0, 0, 0.2);
            color: #10452D;
        }

        .home-hero a.home-button.home-register:hover {
            transform: translateY(-2px) scale(1.03);
            border-color: #FFDA57;
            background: #FFDA57;
            box-shadow: 0 0 22px rgba(255, 201, 40, 0.48), 0 10px 24px rgba(0, 0, 0, 0.2);
            color: #10452D;
        }

        .home-nav a.home-register:active {
            transform: translateY(0) scale(0.98);
            box-shadow: 0 0 22px rgba(255, 201, 40, 0.48), 0 5px 16px rgba(0, 0, 0, 0.2);
        }

        .home-nav a.home-register .home-nav-icon {
            color: #10452D;
        }

        .home-hero-content {
            display: flex;
            width: min(100% - 48px, 1232px);
            flex: 1;
            flex-direction: column;
            justify-content: center;
            margin: 0 auto;
            padding: 132px 0 90px;
        }

        .home-eyebrow {
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 10px;
            margin: 0 0 22px;
            color: #e9f5eb;
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .home-eyebrow::before {
            width: 25px;
            height: 2px;
            background: var(--home-gold);
            content: "";
        }

        .home-title {
            max-width: 780px;
            margin: 0;
            color: #ffffff;
            font-size: clamp(3.2rem, 7.3vw, 6.25rem);
            font-weight: 800;
            letter-spacing: -0.065em;
            line-height: 0.94;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.3), 0 0 22px rgba(52, 211, 153, 0.24);
            text-wrap: balance;
        }

        .home-title span {
            display: block;
            color: var(--home-gold);
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.28), 0 0 20px rgba(255, 201, 40, 0.3);
        }

        .home-tagline {
            margin: 25px 0 0;
            color: #ffffff;
            font-size: clamp(1.15rem, 2.2vw, 1.55rem);
            font-weight: 600;
            letter-spacing: -0.025em;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.48);
        }

        .home-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 33px;
        }

        .home-hero a.home-button {
            min-width: 150px;
            min-height: 54px;
            padding: 0 28px;
            font-size: 1rem;
        }

        .home-footer {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px clamp(24px, 7vw, 104px);
            border-top: 2px solid rgba(255, 201, 40, 0.72);
            background: #082517;
            color: rgba(255, 255, 255, 0.78);
        }

        .home-footer-brand {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .home-footer-brand img {
            width: min(220px, 55vw);
            height: 54px;
            object-fit: cover;
            object-position: center;
            transition: filter 220ms ease;
        }

        .home-footer-brand:hover img {
            filter: drop-shadow(0 0 8px rgba(52, 211, 153, 0.55)) drop-shadow(0 0 13px rgba(255, 201, 40, 0.38));
        }

        .home-footer-brand .home-brand-tagline {
            margin-top: -7px;
        }

        .home-footer p {
            margin: 0;
            font-size: 0.9rem;
        }

        @media (max-width: 1080px) {
            .home-header {
                flex-wrap: wrap;
                gap: 8px;
                justify-content: center;
            }

            .home-logo {
                flex: 0 0 100%;
                align-items: center;
            }

            .home-logo img {
                width: min(100%, 280px);
                height: 72px;
            }

            .home-brand-tagline {
                font-size: 0.7rem;
            }

            .home-nav {
                width: 100%;
                justify-content: flex-end;
            }
        }

        @media (max-width: 700px) {
            .home-header {
                flex-wrap: wrap;
                min-height: 76px;
                gap: 8px;
                padding: 12px 22px;
            }

            .home-logo {
                flex: 0 0 100%;
            }

            .home-logo img {
                width: min(100%, 260px);
                height: 68px;
            }

            .home-nav {
                width: 100%;
                justify-content: space-between;
                gap: 8px;
            }

            .home-nav a {
                min-height: 44px;
                flex: 1 1 0;
                padding: 0 10px;
                font-size: 0.88rem;
            }

            .home-nav .home-nav-icon {
                width: 17px;
                height: 17px;
            }

            .home-hero {
                background-position: 58% center;
            }

            .home-hero-content {
                width: min(100% - 44px, 540px);
                flex: 0 0 auto;
                justify-content: flex-start;
                padding: 210px 0 72px;
            }

            .home-title {
                font-size: clamp(3.15rem, 12vw, 5rem);
            }

            .home-footer {
                justify-content: center;
                text-align: center;
            }

            .home-footer-brand {
                align-items: center;
            }
        }

        @media (max-width: 420px) {
            .home-header {
                gap: 6px;
                padding-right: 14px;
                padding-left: 14px;
            }

            .home-logo img {
                width: min(100%, 240px);
                height: 64px;
            }

            .home-nav {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .home-nav a {
                min-height: 42px;
                padding: 0 10px;
                font-size: 0.88rem;
            }

            .home-actions {
                gap: 10px;
            }

            .home-hero a.home-button {
                min-width: 132px;
                padding: 0 20px;
            }

        }

        @media (max-width: 360px) {
            .home-header {
                padding-right: 12px;
                padding-left: 12px;
            }

            .home-logo img {
                width: min(100%, 230px);
                height: 62px;
            }

            .home-nav {
                gap: 7px;
            }

            .home-nav a {
                min-height: 42px;
                padding: 0 8px;
                font-size: 0.84rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .home-page *,
            .home-page *::before,
            .home-page *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>
<body class="home-page">
    <main>
        <section class="home-hero" aria-labelledby="home-title">
            <header class="home-header">
                <a class="home-logo" href="/index.html" aria-label="AgriMachConnect home">
                    <img src="/assets/images/AgriMachConnect%20Leaf%20Gear%20Logo.png" alt="AgriMachConnect Leaf Gear Logo">
                    <span class="home-brand-tagline">Rent | Farm | Grow Together.</span>
                </a>
                <nav class="home-nav" aria-label="Main navigation">
                    <a href="/pages/public/aboutus.html">
                        <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4m0-4h.01"/></svg>
                        About Us
                    </a>
                    <a href="/pages/public/contact.html">
                        <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        Contact Us
                    </a>
                    <a href="/pages/auth/login.html">
                        <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
                        Login
                    </a>
                    <a class="home-register" href="/pages/auth/register.html">
                        <svg class="home-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a6 6 0 0 1 6-6h2m6-2v8m-4-4h8"/></svg>
                        Register
                    </a>
                </nav>
            </header>

            <div class="home-hero-content">
                <p class="home-eyebrow">Shared equipment. Stronger harvests.</p>
                <h1 class="home-title" id="home-title">Smart Farming <span>Starts Here</span></h1>
                <p class="home-tagline">Rent Machinery. Save Money. Grow More.</p>
                <div class="home-actions">
                    <a class="home-button" href="/pages/auth/login.html">
                        <svg class="home-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3"/><path d="M12 3h7a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-7"/></svg>
                        Login
                    </a>
                    <a class="home-button home-register" href="/pages/auth/register.html">
                        <svg class="home-button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a6 6 0 0 1 6-6h2m6-2v8m-4-4h8"/></svg>
                        Register
                    </a>
                </div>
            </div>
        </section>
    </main>
    <footer class="home-footer">
        <a class="home-footer-brand" href="/index.html" aria-label="AgriMachConnect home">
            <img src="/assets/images/AgriMachConnect%20Leaf%20Gear%20Logo.png" alt="AgriMachConnect Leaf Gear Logo">
            <span class="home-brand-tagline">Rent | Farm | Grow Together.</span>
        </a>
        <p>Connecting farms with the machinery that helps them grow.</p>
    </footer>
</body>
</html>
