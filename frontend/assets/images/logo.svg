<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none" role="img" aria-label="AgriMech Connect Logo">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark Container -->
  <g transform="translate(6, 6)">
    <!-- Tech Gear Wheel Segment -->
    <path d="M 26 2 A 24 24 0 0 1 50 26 L 44 26 A 18 18 0 0 0 26 8 Z" fill="url(#gearGrad)" opacity="0.95" />
    <path d="M 50 26 A 24 24 0 0 1 26 50 L 26 44 A 18 18 0 0 0 44 26 Z" fill="url(#gearGrad)" opacity="0.8" />
    <!-- Gear teeth details -->
    <rect x="23" y="0" width="6" height="5" rx="1.5" fill="#f59e0b" />
    <rect x="47" y="23" width="5" height="6" rx="1.5" fill="#f59e0b" />
    <rect x="23" y="47" width="6" height="5" rx="1.5" fill="#f59e0b" />
    
    <!-- Sprouting Agritech Leaf -->
    <path d="M 8 36 C 8 20 22 10 38 6 C 36 22 26 38 12 42 Z" fill="url(#leafGrad)" filter="url(#glow)" />
    <!-- Leaf central vein -->
    <path d="M 12 38 Q 24 24 34 10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <!-- Secondary small leaf -->
    <path d="M 20 28 C 26 20 34 18 42 16 C 40 24 34 29 26 31 Z" fill="#34d399" opacity="0.9" />

    <!-- Center tech node dot -->
    <circle cx="26" cy="26" r="3.5" fill="#ffffff" />
    <circle cx="26" cy="26" r="2" fill="#047857" />
  </g>

  <!-- Typography -->
  <g transform="translate(70, 42)">
    <text font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.5px" fill="#ffffff">
      Agri<tspan fill="#34d399">Mech</tspan>
    </text>
    <text x="120" y="-1" font-family="'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" letter-spacing="0.2px" fill="#e2e8f0">
      Connect
    </text>
    <circle cx="206" cy="-8" r="3.5" fill="#f59e0b" />
  </g>
</svg>
