<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AgriMachConnect administration dashboard.">
    <title>Admin dashboard | AgriMachConnect</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body class="admin-dashboard-page">
    <div class="admin-app">
        <aside class="admin-sidebar" id="adminSidebar">
            <a class="admin-brand" href="/pages/admin/admin-dashboard.html" aria-label="AgriMachConnect admin home">
                <img src="/assets/images/AgriMachConnect%20Leaf%20Gear%20Logo.png" alt="">
                <span><strong>AgriMachConnect</strong><small>ADMIN CONSOLE</small></span>
            </a>
            <nav class="admin-nav" aria-label="Admin sections">
                <button type="button" class="admin-nav-link is-active" data-section="overview"><span>⌂</span>Overview</button>
                <button type="button" class="admin-nav-link" data-section="owner-requests" id="navOwnerRequests"><span>✓</span>Owner Access Requests</button>
                <button type="button" class="admin-nav-link" data-section="users"><span>♙</span>Users</button>
                <button type="button" class="admin-nav-link" data-section="machinery"><span>⚙</span>Machinery</button>
                <button type="button" class="admin-nav-link" data-section="bookings"><span>▣</span>Bookings</button>
                <button type="button" class="admin-nav-link" data-section="audit"><span>≡</span>Audit &amp; reports</button>
                <button type="button" class="admin-nav-link" data-section="settings"><span>⚒</span>Settings</button>
            </nav>
            <div class="admin-sidebar-bottom">
                <p class="admin-security-note"><span aria-hidden="true">●</span> Secure admin session</p>
                <button type="button" id="adminLogout" class="admin-logout">↪ Log out</button>
            </div>
        </aside>
        <div class="admin-main-wrap">
            <header class="admin-topbar">
                <button id="adminMenuToggle" class="admin-menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button>
                <div><span class="admin-topbar-caption">ADMINISTRATION</span><strong id="adminSectionName">Overview</strong></div>
                <div class="admin-user-chip"><span class="admin-avatar" id="adminAvatar">A</span><span><strong id="adminUserName">Administrator</strong><small id="adminUserEmail"></small></span></div>
            </header>
            <main id="adminContent" class="admin-content" tabindex="-1" aria-live="polite">
                <div class="admin-state" role="status">Checking secure administrator session…</div>
            </main>
        </div>
        <div class="admin-scrim" id="adminScrim" hidden></div>
    </div>
    <script src="/assets/js/common/api.js"></script>
    <script src="/assets/js/pages/admin/admin-dashboard.js"></script>
</body>
</html>
