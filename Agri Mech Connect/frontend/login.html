<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your AgriMachConnect account to manage farm equipment and bookings.">
    <title>Log in | AgriMachConnect</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <main class="auth-main">
        <div class="agri-backdrop" aria-hidden="true">
            <div class="agri-aura agri-aura-one"></div>
            <div class="agri-aura agri-aura-two"></div>
            <div class="agri-light-trail agri-light-trail-one"></div>
            <div class="agri-light-trail agri-light-trail-two"></div>
            <div class="agri-sprig agri-sprig-left">
                <span class="agri-leaf leaf-one"></span>
                <span class="agri-leaf leaf-two"></span>
                <span class="agri-leaf leaf-three"></span>
                <span class="agri-leaf leaf-four"></span>
                <span class="agri-stem"></span>
            </div>
            <div class="agri-sprig agri-sprig-right">
                <span class="agri-leaf leaf-one"></span>
                <span class="agri-leaf leaf-two"></span>
                <span class="agri-leaf leaf-three"></span>
                <span class="agri-leaf leaf-four"></span>
                <span class="agri-stem"></span>
            </div>
            <span class="agri-particle particle-one"></span>
            <span class="agri-particle particle-two"></span>
            <span class="agri-particle particle-three"></span>
            <span class="agri-particle particle-four"></span>
        </div>
        <section class="form-container auth-card" aria-labelledby="loginTitle">
            <div class="form-header">
                <span class="login-card-icon" aria-hidden="true">✦</span>
                <h2 id="loginTitle">Welcome back</h2>
                <p>Log in to your AgriMachConnect account</p>
            </div>
            <div class="login-role-cards" aria-label="AgriMachConnect account roles">
                <div class="login-role-card is-active">
                    <span class="login-role-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M12 20V7M12 11c-2.8-2.5-5.7-1.1-5.7 1.5 0 2.5 3.8 2.2 5.7.3M12 14c2.8-2.5 5.7-1.1 5.7 1.5 0 2.5-3.8 2.2-5.7.3M12 7c-2.2-2.3-4.9-.8-4.9 1.4 0 1.9 3.4 1.7 4.9.4M12 7c2.2-2.3 4.9-.8 4.9 1.4 0 1.9-3.4 1.7-4.9.4M6 20h12" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
                    </span>
                    <span><strong>Farmer</strong><small>Rent machinery</small></span>
                </div>
                <div class="login-role-card">
                    <span class="login-role-icon owner-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none"><path d="M4 15h11V8.5c0-1-.8-1.5-1.8-1.5H6c-1.1 0-2 .8-2 1.8V15ZM15 10h3.1c.8 0 1.4.4 1.7 1.1L21 15h-6M7 18.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM18 18.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM9 15h6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"/></svg>
                    </span>
                    <span><strong>Machinery Owner</strong><small>Manage equipment</small></span>
                </div>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email address</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="3.5" y="5.5" width="17" height="13" rx="2"/>
                            <path d="m4.5 7 7.5 5.2L19.5 7"/>
                        </svg>
                        <input type="email" id="loginEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="login-input-wrap">
                        <svg class="login-input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="5" y="10" width="14" height="10" rx="2"/>
                            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                        </svg>
                        <input type="password" id="loginPassword" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                        <button type="button" class="login-password-toggle" id="loginPasswordToggle" aria-controls="loginPassword" aria-pressed="false">Show</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-accent" id="loginSubmitBtn">Log in</button>
                <p id="loginMessage" class="form-feedback" role="status" aria-live="polite"></p>
            </form>
            <p class="auth-switch">New to AgriMachConnect? <a href="register.html">Create an account</a></p>
        </section>
    </main>

    <div class="login-success-overlay" id="loginSuccess" hidden>
        <section class="login-success-dialog" role="status" aria-live="polite" aria-labelledby="loginSuccessTitle">
            <div class="login-success-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none"><path d="m6.5 12.5 3.5 3.5 7.5-8"/></svg>
            </div>
            <div>
                <h2 id="loginSuccessTitle">Login successful!</h2>
                <p>Welcome back to AgriMachConnect.</p>
            </div>
        </section>
    </div>


    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
