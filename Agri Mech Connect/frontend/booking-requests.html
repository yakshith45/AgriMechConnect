<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review real farmer machinery booking requests.">
    <title>Booking Requests | AgriMech Connect</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <a href="index.html" class="logo-wrap" aria-label="AgriMech Connect Home">
        <img src="images/logo.svg" alt="AgriMech Connect" class="logo-svg">
    </a>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle navigation" type="button">☰</button>
    <nav id="mainNav">
        <div class="nav-links">
            <a href="owner-dashboard.html">Owner Portal</a>
            <a href="add-machinery.html">Manage Machinery</a>
            <a href="booking-requests.html" class="active">Booking Requests</a>
            <a href="index.html" id="logoutLink" class="btn btn-sm btn-outline">Log out</a>
        </div>
    </nav>
</header>
<main class="dashboard">
    <div style="margin-bottom:28px">
        <span class="section-tag" style="margin-bottom:8px">Incoming requests</span>
        <h1 style="font-family:var(--font-heading);font-size:clamp(1.8rem,3.5vw,2.5rem);font-weight:800;color:var(--ink-900);margin:0 0 6px">Farmer Booking Requests</h1>
        <p style="color:var(--ink-500);margin:0">Review dates and respond to booking requests for your machinery.</p>
    </div>
    <p id="bookingMessage" class="form-feedback" role="status" aria-live="polite"></p>
    <div id="bookingList" class="machinery-grid" aria-live="polite"></div>
</main>
<footer><div class="footer-bottom" style="margin:0 auto;text-align:center"><div>&copy; 2026 AgriMech Connect. Modern Agricultural Equipment Sharing.</div></div></footer>
<script>
    document.getElementById("mobileToggle")?.addEventListener("click", () => document.getElementById("mainNav").classList.toggle("show"));
    document.getElementById("logoutLink")?.addEventListener("click", () => {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
    });
</script>
<script src="api.js"></script>
<script src="booking-requests.js"></script>
</body>
</html>
